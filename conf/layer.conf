# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-torizon-bsp"
BBFILE_PATTERN_meta-torizon-bsp := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-torizon-bsp = "91"

LAYERDEPENDS_meta-torizon-bsp = "meta-torizon"
LAYERSERIES_COMPAT_meta-torizon-bsp = "wrynose"

BBFILES_DYNAMIC += "\
    freescale-layer:${LAYERDIR}/dynamic-layers/meta-freescale/*/*/*.bb \
    freescale-layer:${LAYERDIR}/dynamic-layers/meta-freescale/*/*/*.bbappend \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/meta-imx-bsp/*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/meta-imx-bsp/*/*/*.bbappend \
    imx-frdm-release:${LAYERDIR}/dynamic-layers/meta-imx-frdm/*/*/*.bbappend \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/meta-imx-ml/*/*/*.bb \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/meta-imx-ml/*/*/*.bbappend \
    intel:${LAYERDIR}/dynamic-layers/meta-intel/*/*/*.bb \
    intel:${LAYERDIR}/dynamic-layers/meta-intel/*/*/*.bbappend \
    meta-beagle:${LAYERDIR}/dynamic-layers/meta-beagle/*/*/*.bb \
    meta-beagle:${LAYERDIR}/dynamic-layers/meta-beagle/*/*/*.bbappend \
    meta-rz-bsp:${LAYERDIR}/dynamic-layers/meta-rz-bsp/*/*/*.bb \
    meta-rz-bsp:${LAYERDIR}/dynamic-layers/meta-rz-bsp/*/*/*.bbappend \
    meta-synaptics:${LAYERDIR}/dynamic-layers/meta-synaptics/*/*/*.bb \
    meta-synaptics:${LAYERDIR}/dynamic-layers/meta-synaptics/*/*/*.bbappend \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/*/*/*.bb \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/*/*/*.bbappend \
    toradex-bsp-common-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp/meta-toradex-bsp-common/*/*/*.bb \
    toradex-bsp-common-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp/meta-toradex-bsp-common/*/*/*.bbappend \
    toradex-ti-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp/meta-toradex-ti/*/*/*.bb \
    toradex-ti-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp/meta-toradex-ti/*/*/*.bbappend \
    stm-st-stm32mp:${LAYERDIR}/dynamic-layers/meta-stm32mp-bsp/*/*/*.bb \
    stm-st-stm32mp:${LAYERDIR}/dynamic-layers/meta-stm32mp-bsp/*/*/*.bbappend \
    tegra:${LAYERDIR}/dynamic-layers/meta-tegra/*/*/*.bb \
    tegra:${LAYERDIR}/dynamic-layers/meta-tegra/*/*/*.bbappend \
    toradex-bsp-common-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp-common/*/*/*.bb \
    toradex-bsp-common-layer:${LAYERDIR}/dynamic-layers/meta-toradex-bsp-common/*/*/*.bbappend \
    toradex-ti-layer:${LAYERDIR}/dynamic-layers/meta-toradex-ti/*/*/*.bb \
    toradex-ti-layer:${LAYERDIR}/dynamic-layers/meta-toradex-ti/*/*/*.bbappend \
    virtualization-layer:${LAYERDIR}/dynamic-layers/meta-virtualization/*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/meta-virtualization/*/*/*.bbappend \
    mediatek-bsp:${LAYERDIR}/dynamic-layers/meta-mediatek-bsp/*/*/*.bb \
    mediatek-bsp:${LAYERDIR}/dynamic-layers/meta-mediatek-bsp/*/*/*.bbappend \
    adlinktech-bsp:${LAYERDIR}/dynamic-layers/meta-adlink-mtk/*/*/*.bb \
    adlinktech-bsp:${LAYERDIR}/dynamic-layers/meta-adlink-mtk/*/*/*.bbappend \
"
